name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills and agents
        run: python3 scripts/validate.py
      - name: Check generated files are up to date
        run: |
          python3 scripts/link.py
          git status --porcelain .claude .claude-plugin
          test -z "$(git status --porcelain .claude .claude-plugin)"
